[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagentfabric"
version = "0.1.0"
description = "Open-source framework for distributed, event-driven AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = [
    "ai-agents",
    "multi-agent",
    "event-driven",
    "redis",
    "langgraph",
    "a2a",
]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["framework"]

[tool.pytest.ini_options]
pythonpath = ["framework", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
